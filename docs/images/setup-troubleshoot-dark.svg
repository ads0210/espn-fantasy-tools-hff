<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" xml:space="preserve" role="img" aria-label="If something goes wrong: each symptom and its fix" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>If something goes wrong: each symptom and its fix</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7C8E7E"/></marker></defs>
<rect width="1000" height="416" rx="10" fill="#070A08"/>
<text x="24" y="34" font-size="16" font-weight="800" fill="#E6F2E4">If something goes wrong</text><rect x="24" y="56" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="81" font-size="12.5" font-weight="700" fill="#E6F2E4">Pages come up empty, or the site can’t reach your league</text><path d="M494 76 L528 76" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="56" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="81" font-size="12.5" fill="#93A695">Replace the ESPN cookies in Site Configuration</text><rect x="24" y="106" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="131" font-size="12.5" font-weight="700" fill="#E6F2E4">No setup code in the build log</text><path d="M494 126 L528 126" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="106" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="131" font-size="12.5" fill="#93A695">The build failed: fix it and redeploy</text><rect x="24" y="156" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="181" font-size="12.5" font-weight="700" fill="#E6F2E4">The build fails</text><path d="M494 176 L528 176" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="156" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="181" font-size="12.5" fill="#93A695">Clear the Build command: it must be empty</text><rect x="24" y="206" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="231" font-size="12.5" font-weight="700" fill="#E6F2E4">Team names say “Loading league data”</text><path d="M494 226 L528 226" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="206" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="231" font-size="12.5" fill="#93A695">Refresh; if it stays, check the ESPN cookies</text><rect x="24" y="256" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="281" font-size="12.5" font-weight="700" fill="#E6F2E4">Blanks or zeroes where names or byes should be</text><path d="M494 276 L528 276" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="256" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="281" font-size="12.5" fill="#93A695">Site Configuration → Refresh all league data</text><rect x="24" y="306" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="331" font-size="12.5" font-weight="700" fill="#E6F2E4">You lost the Admin Password</text><path d="M494 326 L528 326" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="306" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="331" font-size="12.5" fill="#93A695">New KV namespace, its ID in wrangler.jsonc, setup again</text><rect x="24" y="356" width="470" height="40" rx="5" fill="#111713" stroke="#2C3B2E"/><text x="38" y="381" font-size="12.5" font-weight="700" fill="#E6F2E4">You want to start again</text><path d="M494 376 L528 376" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="532" y="356" width="444" height="40" rx="5" fill="#161D18" stroke="#63FF4A"/><text x="546" y="381" font-size="12.5" fill="#93A695">Delete the Worker, then R2, then KV, then the fork</text>
</svg>
