<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 272" width="1004" height="272" xml:space="preserve" role="img" aria-label="Setup in eleven steps: GitHub, then Cloudflare, then the deploy, then the wizard" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Setup in eleven steps: GitHub, then Cloudflare, then the deploy, then the wizard</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5B6956"/></marker></defs>
<rect width="1004" height="272" rx="10" fill="#EBF1E9"/>
<rect x="24" y="30" width="220" height="190" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="24" y="30" width="220" height="3" fill="#20629E"/><text x="38" y="56" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">GITHUB</text><text x="38" y="78" font-size="16" font-weight="800" fill="#0D140C">Your fork</text><text x="38" y="100" font-size="12.5" fill="#48564A">1 Fork the repository</text><text x="38" y="118" font-size="12.5" fill="#48564A">2 Enable Actions</text><text x="38" y="136" font-size="12.5" fill="#48564A">8 Point the code at</text><text x="38" y="154" font-size="12.5" fill="#48564A">   your storage</text><g><rect x="186" y="42" width="46" height="20" rx="10" fill="#20629E"/><text x="209" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1·2·8</text></g><rect x="276" y="30" width="250" height="190" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="276" y="30" width="250" height="3" fill="#876300"/><text x="290" y="56" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">CLOUDFLARE</text><text x="290" y="78" font-size="16" font-weight="800" fill="#0D140C">Your account</text><text x="290" y="100" font-size="12.5" fill="#48564A">3 Create the account</text><text x="290" y="118" font-size="12.5" fill="#48564A">4 Turn on R2</text><text x="290" y="136" font-size="12.5" fill="#48564A">5 Set a spending alert</text><text x="290" y="154" font-size="12.5" fill="#48564A">6 Create the KV namespace</text><text x="290" y="172" font-size="12.5" fill="#48564A">7 Create the R2 bucket</text><g><rect x="468" y="42" width="46" height="20" rx="10" fill="#876300"/><text x="491" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">3–7</text></g><rect x="558" y="30" width="200" height="190" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="558" y="30" width="200" height="3" fill="#876300"/><text x="572" y="56" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">CLOUDFLARE</text><text x="572" y="78" font-size="16" font-weight="800" fill="#0D140C">The deploy</text><text x="572" y="100" font-size="12.5" fill="#48564A">9 Connect the fork</text><text x="572" y="118" font-size="12.5" fill="#48564A">   and deploy</text><text x="572" y="136" font-size="12.5" fill="#48564A">10 Turn on your</text><text x="572" y="154" font-size="12.5" fill="#48564A">     public address</text><g><rect x="700" y="42" width="46" height="20" rx="10" fill="#876300"/><text x="723" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">9·10</text></g><rect x="790" y="30" width="190" height="190" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="790" y="30" width="190" height="3" fill="#12762E"/><text x="804" y="56" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">YOUR SITE</text><text x="804" y="78" font-size="16" font-weight="800" fill="#0D140C">The wizard</text><text x="804" y="100" font-size="12.5" fill="#48564A">11 Setup code</text><text x="804" y="118" font-size="12.5" fill="#48564A">Passwords, league,</text><text x="804" y="136" font-size="12.5" fill="#48564A">tools, history</text><g><rect x="922" y="42" width="46" height="20" rx="10" fill="#12762E"/><text x="945" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">11</text></g><path d="M244 125 L272 125" stroke="#5B6956" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M526 125 L554 125" stroke="#5B6956" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><path d="M758 125 L786 125" stroke="#5B6956" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="500" y="252" text-anchor="middle" font-size="12.5" fill="#5B6956">About twenty minutes. Steps 1 to 10 happen on GitHub and Cloudflare; step 11 on your new site.</text>
</svg>
