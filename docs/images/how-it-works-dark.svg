<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" xml:space="preserve" role="img" aria-label="How the site works: ESPN, then the site on Cloudflare, then pages and Site API" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>How the site works: ESPN, then the site on Cloudflare, then pages and Site API</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7C8E7E"/></marker></defs>
<rect width="1000" height="370" rx="10" fill="#070A08"/>
<rect x="24" y="40" width="230" height="150" rx="6" fill="#111713" stroke="#2C3B2E"/><rect x="24" y="40" width="230" height="3" fill="#5BA8FF"/><text x="38" y="66" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#7C8E7E">SOURCE</text><text x="38" y="88" font-size="16" font-weight="800" fill="#E6F2E4">ESPN</text><text x="38" y="110" font-size="12.5" fill="#93A695">Your league: rosters, scores,</text><text x="38" y="128" font-size="12.5" fill="#93A695">standings, trades, history</text><text x="38" y="146" font-size="12.5" fill="#93A695">NFL games, injuries, news</text><rect x="330" y="24" width="340" height="320" rx="6" fill="#111713" stroke="#2C3B2E"/><rect x="330" y="24" width="340" height="3" fill="#63FF4A"/><text x="344" y="50" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#7C8E7E">YOUR CLOUDFLARE ACCOUNT, FREE TIER</text><text x="344" y="72" font-size="16" font-weight="800" fill="#E6F2E4">The site (one Worker)</text><text x="344" y="94" font-size="12.5" fill="#93A695">Keeps its own copy of each part</text><text x="344" y="112" font-size="12.5" fill="#93A695">of the league, refreshed on its own</text><text x="344" y="130" font-size="12.5" fill="#93A695">schedule: live scores every 15 s</text><text x="344" y="148" font-size="12.5" fill="#93A695">during games, the rest as needed</text><text x="346" y="196" font-size="12.5" font-weight="800" fill="#63FF4A">KV</text><text x="470" y="196" font-size="12.5" fill="#93A695">Settings, passwords (hashed)</text><text x="346" y="216" font-size="12.5" font-weight="800" fill="#63FF4A">R2</text><text x="470" y="216" font-size="12.5" fill="#93A695">The league data it keeps</text><text x="346" y="236" font-size="12.5" font-weight="800" fill="#63FF4A">Durable Objects</text><text x="470" y="236" font-size="12.5" fill="#93A695">Live timeline, Fortune Teller,</text><text x="470" y="256" font-size="12.5" fill="#93A695">the site log, the API pace</text><text x="346" y="290" font-size="12" fill="#7C8E7E">Every minute: scores, odds, the log. Nobody needs to be watching.</text><rect x="746" y="24" width="230" height="150" rx="6" fill="#111713" stroke="#2C3B2E"/><rect x="746" y="24" width="230" height="3" fill="#63FF4A"/><text x="760" y="50" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#7C8E7E">BEHIND THE LEAGUE PASSWORD</text><text x="760" y="72" font-size="16" font-weight="800" fill="#E6F2E4">Pages and tools</text><text x="760" y="94" font-size="12.5" fill="#93A695">The home page and eight tools</text><text x="760" y="112" font-size="12.5" fill="#93A695">for every member, on any</text><text x="760" y="130" font-size="12.5" fill="#93A695">phone or computer</text><rect x="746" y="194" width="230" height="150" rx="6" fill="#111713" stroke="#2C3B2E"/><rect x="746" y="194" width="230" height="3" fill="#FFD24D"/><text x="760" y="220" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#7C8E7E">BEHIND THE LEAGUE’S KEY</text><text x="760" y="242" font-size="16" font-weight="800" fill="#E6F2E4">Site API</text><text x="760" y="264" font-size="12.5" fill="#93A695">Spreadsheets, scripts, phones</text><text x="760" y="282" font-size="12.5" fill="#93A695">and smart homes read the</text><text x="760" y="300" font-size="12.5" fill="#93A695">league, at the site’s pace</text><path d="M254 115 L326 115" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="290" y="107" text-anchor="middle" font-size="11" fill="#7C8E7E">reads</text><path d="M670 99 L742 99" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="706" y="91" text-anchor="middle" font-size="11" fill="#7C8E7E">answers</text><path d="M670 269 L742 269" stroke="#7C8E7E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="706" y="261" text-anchor="middle" font-size="11" fill="#7C8E7E">answers</text>
</svg>
