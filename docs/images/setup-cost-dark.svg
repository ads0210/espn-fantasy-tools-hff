<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" xml:space="preserve" role="img" aria-label="What the free tier covers against what a league uses" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>What the free tier covers against what a league uses</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7C8E7E"/></marker></defs>
<rect width="1000" height="248" rx="10" fill="#070A08"/>
<text x="24" y="34" font-size="16" font-weight="800" fill="#E6F2E4">What the free tier covers, against what a league uses</text><text x="24" y="68" font-size="12.5" font-weight="800" fill="#93A695">Worker requests a day</text><rect x="24" y="78" width="952" height="22" rx="4" fill="#111713" stroke="#2C3B2E"/><rect x="24" y="78" width="99.3888" height="22" rx="4" fill="#63FF4A"/><text x="968" y="94" text-anchor="end" font-size="11.5" font-weight="800" fill="#93A695">free: 100,000</text><text x="24" y="118" font-size="12" fill="#7C8E7E">about 10,500 on a busy Sunday: the minute’s work, and ten members with a page open three hours each</text><text x="24" y="148" font-size="12.5" font-weight="800" fill="#93A695">Settings writes a day</text><rect x="24" y="158" width="952" height="22" rx="4" fill="#111713" stroke="#2C3B2E"/><rect x="24" y="158" width="9.52" height="22" rx="4" fill="#63FF4A"/><text x="968" y="174" text-anchor="end" font-size="11.5" font-weight="800" fill="#93A695">free: 1,000</text><text x="24" y="198" font-size="12" fill="#7C8E7E">a handful: a setting saved now and then</text><text x="24" y="228" font-size="12" fill="#7C8E7E">Estimated from rates measured on a test league. The site also paces itself, and anything asking through Site API, to stay inside.</text>
</svg>
