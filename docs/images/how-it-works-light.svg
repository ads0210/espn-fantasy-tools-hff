<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" xml:space="preserve" role="img" aria-label="How the site works: ESPN, then the site on Cloudflare, then pages and Site API" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>How the site works: ESPN, then the site on Cloudflare, then pages and Site API</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5B6956"/></marker></defs>
<rect width="1000" height="370" rx="10" fill="#EBF1E9"/>
<rect x="24" y="40" width="230" height="150" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="24" y="40" width="230" height="3" fill="#20629E"/><text x="38" y="66" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">SOURCE</text><text x="38" y="88" font-size="16" font-weight="800" fill="#0D140C">ESPN</text><text x="38" y="110" font-size="12.5" fill="#48564A">Your league: rosters, scores,</text><text x="38" y="128" font-size="12.5" fill="#48564A">standings, trades, history</text><text x="38" y="146" font-size="12.5" fill="#48564A">NFL games, injuries, news</text><rect x="330" y="24" width="340" height="320" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="330" y="24" width="340" height="3" fill="#12762E"/><text x="344" y="50" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">YOUR CLOUDFLARE ACCOUNT, FREE TIER</text><text x="344" y="72" font-size="16" font-weight="800" fill="#0D140C">The site (one Worker)</text><text x="344" y="94" font-size="12.5" fill="#48564A">Keeps its own copy of each part</text><text x="344" y="112" font-size="12.5" fill="#48564A">of the league, refreshed on its own</text><text x="344" y="130" font-size="12.5" fill="#48564A">schedule: live scores every 15 s</text><text x="344" y="148" font-size="12.5" fill="#48564A">during games, the rest as needed</text><text x="346" y="196" font-size="12.5" font-weight="800" fill="#12762E">KV</text><text x="470" y="196" font-size="12.5" fill="#48564A">Settings, passwords (hashed)</text><text x="346" y="216" font-size="12.5" font-weight="800" fill="#12762E">R2</text><text x="470" y="216" font-size="12.5" fill="#48564A">The league data it keeps</text><text x="346" y="236" font-size="12.5" font-weight="800" fill="#12762E">Durable Objects</text><text x="470" y="236" font-size="12.5" fill="#48564A">Live timeline, Fortune Teller,</text><text x="470" y="256" font-size="12.5" fill="#48564A">the site log, the API pace</text><text x="346" y="290" font-size="12" fill="#5B6956">Every minute: scores, odds, the log. Nobody needs to be watching.</text><rect x="746" y="24" width="230" height="150" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="746" y="24" width="230" height="3" fill="#12762E"/><text x="760" y="50" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">BEHIND THE LEAGUE PASSWORD</text><text x="760" y="72" font-size="16" font-weight="800" fill="#0D140C">Pages and tools</text><text x="760" y="94" font-size="12.5" fill="#48564A">The home page and eight tools</text><text x="760" y="112" font-size="12.5" fill="#48564A">for every member, on any</text><text x="760" y="130" font-size="12.5" fill="#48564A">phone or computer</text><rect x="746" y="194" width="230" height="150" rx="6" fill="#FFFFFF" stroke="#B4C6B3"/><rect x="746" y="194" width="230" height="3" fill="#876300"/><text x="760" y="220" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#5B6956">BEHIND THE LEAGUE’S KEY</text><text x="760" y="242" font-size="16" font-weight="800" fill="#0D140C">Site API</text><text x="760" y="264" font-size="12.5" fill="#48564A">Spreadsheets, scripts, phones</text><text x="760" y="282" font-size="12.5" fill="#48564A">and smart homes read the</text><text x="760" y="300" font-size="12.5" fill="#48564A">league, at the site’s pace</text><path d="M254 115 L326 115" stroke="#5B6956" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="290" y="107" text-anchor="middle" font-size="11" fill="#5B6956">reads</text><path d="M670 99 L742 99" stroke="#5B6956" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="706" y="91" text-anchor="middle" font-size="11" fill="#5B6956">answers</text><path d="M670 269 L742 269" stroke="#5B6956" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="706" y="261" text-anchor="middle" font-size="11" fill="#5B6956">answers</text>
</svg>
